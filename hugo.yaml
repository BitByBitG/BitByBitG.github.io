baseURL: "https://blog.bitbybit.dpdns.org/"
languageCode: zh-cn
defaultContentLanguage: zh
title: "BitByBit 的博客"
theme: PaperMod
hasCJKLanguage: true
enableRobotsTXT: true

markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: false
    lineNos: false
    
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['$$', '$$']
            - ['\[', '\]']
          inline:
            - ['$', '$']
            - ['\(', '\)']

pagination:
  pagerSize: 10

params:
  author: BitByBit
  description: "全体群友心中的太阳——敬爱的 BitByBit 同志"
  defaultTheme: auto
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowWordCount: true
  ShowToc: true
  TocOpen: false
  assets:
    disableHLJS: true

  homeInfoParams:
    Title: "BitByBit 的博客"
    Content: |
      [返回主站](https://bitbybit.dpdns.org/)  
  comments: true

menu:
  main:
    - name: 文章
      url: /posts/
      weight: 10
    - name: 标签
      url: /tags/
      weight: 20
    - name: 归档
      url: /archives/
      weight: 30
    - name: 搜索
      url: /search/
      weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON

enableGitInfo: true
timeZone: Asia/Shanghai

frontmatter:
  lastmod:
    - ":git"
    - lastmod
    - date